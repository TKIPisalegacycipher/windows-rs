name: okojo-gen

# Okojo's branch gets no upstream CI (gen.yml runs on master and PRs only).
# This regenerates the reactor bindings on every push to it, so a hand edit to
# a generated file that the next regeneration would undo fails here instead.

permissions:
  contents: read

on:
  push:
    branches:
      - okojo-flow-layout
  pull_request:
    branches:
      - okojo-flow-layout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen:
    name: tool-${{ matrix.tool }}
    runs-on: windows-2025-vs2026

    env:
      RUSTFLAGS: -D warnings

    strategy:
      fail-fast: false
      matrix:
        tool: [reactor-metadata, reactor]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update toolchain
        run: rustup update --no-self-update stable && rustup default stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.tool }}
      - name: Run
        run: cargo run -p tool-${{ matrix.tool }} --release
      - name: Check
        shell: bash
        run: |
          git add -N .
          git diff --exit-code || (echo '::error::Generated `tool-${{ matrix.tool }}` is out-of-date. Please run `cargo run -p tool-${{ matrix.tool }}`'; exit 1)
